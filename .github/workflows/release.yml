name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Test
        run: python -m pytest -q --basetemp .runtime-ci-tests
      - name: Build and package
        run: python tools/build_windows.py --repository '${{ github.repository }}'
      - name: Smoke executable
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $executable = Join-Path $PWD "dist/$version/R2Companion/R2Companion.exe"
          $data = Join-Path $PWD '.runtime-ci-exe'
          $process = Start-Process -FilePath $executable -ArgumentList @('--data-dir', ('"{0}"' -f $data), '--smoke-test', '--smoke-droids', '--smoke-navigation', '--smoke-seconds', '9') -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { throw 'Smoke timeout' }
          if ($process.ExitCode -ne 0) { throw "Smoke exit code $($process.ExitCode)" }
          $report = Get-Content (Join-Path $data 'smoke.json') -Raw | ConvertFrom-Json
          if ($report.version -ne $version) { throw 'Loaded version differs from package' }
          if ($null -eq $report.navigation -or @($report.navigation.PSObject.Properties).Count -lt 10 -or @($report.navigation.PSObject.Properties | Where-Object { $_.Value -ne $true }).Count -ne 0) { throw 'Navigation smoke failed' }
          if ($report.active_timers_after_shutdown -ne 0) { throw 'Timers remained active' }
          if ($report.movement_timer_after_shutdown) { throw 'Movement timer remained active' }
          $expectedDroids = @(Get-ChildItem 'src/r2_companion/assets/droids' -Filter profile.json -Recurse | ForEach-Object { (Get-Content $_.FullName -Raw | ConvertFrom-Json).id } | Sort-Object)
          $actualDroids = @($report.droids | ForEach-Object { $_.id } | Sort-Object)
          if (@(Compare-Object $expectedDroids $actualDroids).Count -ne 0 -or @($report.droids | Where-Object { -not $_.accepted }).Count -ne 0) { throw 'Droid smoke failed' }
          if ($report.audio_effects -le 0 -or ($report.audio_output_available -and ($report.audio_errors -ne 0 -or $report.audio_loaded_effects -ne $report.audio_effects))) { throw 'Audio resource smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: R2Companion-Windows-x64
          path: |
            dist/R2Companion-Windows-x64.zip
            dist/R2Companion-Windows-x64.zip.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R2Companion-Windows-x64
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="packaging/docs/release-notes/$RELEASE_TAG.md"
          test -f "$notes"
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            test "$state" = true || { echo 'A published release will not be overwritten'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file "$notes" --title "R2 Desktop Companion ${RELEASE_TAG#v}"
          fi
          gh release upload "$RELEASE_TAG" release/R2Companion-Windows-x64.zip release/R2Companion-Windows-x64.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$notes" --draft=false --latest
