name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Test
        run: python -m pytest -q --basetemp .runtime-ci-tests
      - name: Build and package
        run: python tools/build_windows.py --repository '${{ github.repository }}'
      - name: Smoke executable
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $executable = Join-Path $PWD "dist/$version/R2Companion/R2Companion.exe"
          $data = Join-Path $PWD '.runtime-ci-exe'
          $process = Start-Process -FilePath $executable -ArgumentList @('--data-dir', ('"{0}"' -f $data), '--smoke-test') -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { throw 'Smoke timeout' }
          if ($process.ExitCode -ne 0) { throw "Smoke exit code $($process.ExitCode)" }
          $report = Get-Content (Join-Path $data 'smoke.json') -Raw | ConvertFrom-Json
          if ($report.active_timers_after_shutdown -ne 0) { throw 'Timers remained active' }
      - uses: actions/upload-artifact@v4
        with:
          name: R2Companion-Windows-x64
          path: |
            dist/R2Companion-Windows-x64.zip
            dist/R2Companion-Windows-x64.zip.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: R2Companion-Windows-x64
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release/R2Companion-Windows-x64.zip release/R2Companion-Windows-x64.zip.sha256 --clobber
