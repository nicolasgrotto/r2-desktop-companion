name: Native Windows and package validation

# Explicit validation route; never publishes or runs on pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: windows
      ARTIFACT_LABEL: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Validate native desktop and tests
        run: python -m pytest -q -m windows_native --basetemp .runtime-native/tests --junitxml .runtime-native/results.xml --test-inventory .runtime-native/selection.json
      - name: Build isolated package
        run: python tools/build_windows.py --artifact-label "$env:ARTIFACT_LABEL"
      - name: Smoke package with restricted PATH
        run: python tools/verify_package.py --artifact-label "$env:ARTIFACT_LABEL" --data-dir .runtime-native/package
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime-native/
          if-no-files-found: warn
