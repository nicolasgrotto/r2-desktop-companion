name: Change checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.group }} / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        group: [logic, qt]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run selected group
        run: python -m pytest -q -m '${{ matrix.group }}' --basetemp .runtime-checks/tests --junitxml .runtime-checks/results.xml --test-inventory .runtime-checks/selection.json
      - name: Retain results and selected dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.group }}-python-${{ matrix.python }}
          path: .runtime-checks/
          if-no-files-found: warn
