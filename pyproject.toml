[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2-desktop-companion"
version = "1.3.0"
description = "Mascote desktop offline para Windows"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials==6.10.2", "PySide6-Addons==6.10.2", "psutil==7.2.2",
    "typing_extensions==4.16.0; sys_platform == 'win32'",
    "winrt-runtime==4.2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Media.Control==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==4!10.0.28000.2957; sys_platform == 'win32'",
]

[project.scripts]
r2-companion = "r2_companion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
r2_companion = ["assets/**/*.json", "assets/**/*.png", "assets/**/*.wav", "assets/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "logic: rules, parsing and doubles without a Qt application or live Windows integration",
    "qt: Qt objects, event loop and rendering that can run with the offscreen platform",
    "windows_native: live Windows APIs, PowerShell, desktop, focus or complete Companion lifecycle",
]
